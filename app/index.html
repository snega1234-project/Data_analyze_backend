<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Data Analytics</title>
    <meta name="description" content="A powerful, seamless data analytics and visualization platform.">
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Nexus Data Analytics</h1>
            <p>Upload your dataset and instantly generate beautiful insights.</p>
        </header>

        <main>
            <div class="tabs" style="grid-column: 1 / -1; display: flex; gap: 1rem; margin-bottom: 1rem;">
                <button class="btn primary-btn tab-btn active" id="tab-file">Data Analysis</button>
                <button class="btn action-btn tab-btn" id="tab-db">Database AI Analysis</button>
            </div>

            <section class="card upload-section" id="upload-section">
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </div>
                    <h2 style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">1. Upload Data</h2>
                </div>
                <div class="file-upload-wrapper" id="drop-zone">
                    <input type="file" id="file-input" accept=".csv, .xlsx, .xls">
                    <div class="upload-icon">📁</div>
                    <p>Drag & Drop your CSV/Excel file here</p>
                    <button class="btn primary-btn mt-1" onclick="document.getElementById('file-input').click()"
                        type="button">Browse Files</button>
                    <span id="file-name" class="file-name-display"></span>
                </div>
                <button class="btn action-btn mt-1" id="upload-btn" disabled>Upload & Process</button>
                <div id="dataset-info"
                    style="display: none; margin-top: 1rem; color: #60a5fa; font-weight: 600; text-align: center; font-size: 0.95rem;">
                </div>
                <div class="loader" id="upload-loader" style="display: none;"></div>
            </section>

            <section class="card configure-section disabled" id="configure-section">
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </div>
                    <h2 style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">2. Configure Chart</h2>
                </div>
                <form id="chart-form">
                    <div class="form-group">
                        <label for="chart-type">Chart Type</label>
                        <select id="chart-type" required>
                            <option value="bar">Bar Chart</option>
                            <option value="line">Line Chart</option>
                            <option value="scatter">Scatter Plot</option>
                            <option value="histogram">Histogram</option>
                            <option value="pie">Pie Chart</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="x-field">X-Axis Field (or Categories)</label>
                        <select id="x-field" required></select>
                    </div>

                    <div class="form-group">
                        <label for="y-field">Y-Axis Field (Values - optional for Histogram/Pie)</label>
                        <select id="y-field">
                            <option value="">-- None --</option>
                        </select>
                    </div>

                    <button type="submit" class="btn action-btn primary-btn mt-1">Generate Visualization</button>
                    <div class="loader" id="chart-loader" style="display: none;"></div>
                </form>
            </section>
            <section class="card db-section" id="db-connect-section" style="display: none;">
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                    </div>
                    <h2 style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">1. Connect Database</h2>
                </div>
                <div class="form-group">
                    <label for="db-type">Database Type</label>
                    <select id="db-type" required form="db-form">
                        <option value="">-- Select Database --</option>
                        <option value="mysql">MySQL</option>
                        <option value="sqlserver">SQL Server</option>
                        <option value="postgresql">PostgreSQL</option>
                        <option value="oracle">Oracle</option>
                        <option value="mongodb">MongoDB</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="db-connection">Database Connection String</label>
                    <div style="display: flex; gap: 0.5rem; align-items: stretch;">
                        <input type="text" id="db-connection" placeholder="e.g. mysql://user:pass@localhost:3306/db" class="form-input" required form="db-form" style="flex: 1;">
                        <button type="button" id="test-connection-btn" class="btn action-btn" style="width: auto; margin: 0; display: flex; align-items: center; padding: 0 1.5rem;">Test</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="ai-api-key">Gemini API Key</label>
                    <input type="password" id="ai-api-key" placeholder="Enter your Gemini API key" class="form-input" required form="db-form">
                </div>
            </section>

            <section class="card db-section" id="db-query-section" style="display: none;">
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    </div>
                    <h2 style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">2. Generate Insights</h2>
                </div>
                <form id="db-form">
                    <div class="form-group">
                        <label for="ai-query">What would you like to know?</label>
                        <textarea id="ai-query" placeholder="e.g. List all the clients with their details" class="form-input" rows="6" style="resize: none;" required></textarea>
                    </div>
                    <button type="submit" class="btn action-btn primary-btn mt-1">Generate & Download</button>
                    <div class="loader" id="db-loader" style="display: none;"></div>
                </form>
                <div id="db-result" style="display: none; margin-top: 1.5rem; text-align: center;">
                    <p style="margin-bottom: 1rem; color: #10b981; font-weight: 600;">Query executed successfully!</p>
                    <div style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 1rem;">
                        <button id="download-csv-btn" class="btn" style="background: #10b981; color: white; flex: 1;">Download CSV</button>
                        <button id="download-excel-btn" class="btn" style="background: #10b981; color: white; flex: 1;">Download Excel</button>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: center;">
                        <button type="button" id="db-new-query-btn" class="btn primary-btn" style="flex: 1;">New Query</button>
                        <button type="button" id="db-cancel-btn" class="btn action-btn" style="flex: 1;">Cancel</button>
                    </div>
                </div>
            </section>
        </main>

        <section class="visualization-section" id="visualization-section" style="display: none;">
            <div class="card result-card">
                <h2>Your Insights</h2>
                <div class="chart-container">
                    <img id="chart-image" alt="Generated Chart" />
                </div>
            </div>
        </section>
    </div>
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js?v=4"></script>
</body>

</html>
